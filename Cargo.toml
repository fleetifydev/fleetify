[workspace]
resolver = "2"
members = [
  "crates/browser-mcp",
  "crates/dispatch-mcp",
  "crates/fleet-wipe",
  "crates/fleetify-core",
  "crates/fleetify-backend",
  "crates/memory-mcp",
  "crates/reveng-mcp",
  "src-tauri",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
fleetify-core = { path = "crates/fleetify-core" }
fleetify-backend = { path = "crates/fleetify-backend" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Release profile = small + fast for shipped installers. LTO + opt-level
# 3 trade compile time for ~20% smaller binaries and stripped symbols
# keep the bundle a few MB smaller still (debuginfo lives in PDB/dSYM
# for support tickets).
[profile.release]
# Size-optimized for shipped installers. The app is I/O-bound (HTTP +
# sqlite + agent-process spawn), so trading opt-level 3 → "s" and thin →
# fat LTO costs imperceptible runtime speed but shrinks the binary by an
# estimated 10-20% of .text. codegen-units=1 lets fat LTO do whole-program
# dead-code elimination; strip drops the symbol table.
#
# panic = "unwind" (the default — deliberately NOT "abort"): Fleetify is a
# multi-agent orchestrator running ~N agent tasks on one shared tokio runtime.
# panic="abort" turns ANY panic on ANY task (a bad turn, an alloc failure under
# memory pressure, a poisoned lock) into a whole-process abort that kills all
# agents at once. "unwind" lets tokio contain a panic to the one offending
# task. The unwind tables cost a few hundred KB of binary — a worthwhile trade
# for fleet-wide crash isolation.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Faster CI / `cargo test` cycles. Most tests are I/O-bound (sqlite +
# fs), so opt-level=1 already covers the hot paths and we skip the
# 30-second LTO link on every change.
[profile.dev]
opt-level = 0
incremental = true
# Drop full DWARF/var debuginfo (cargo's dev default is debug=2) down to
# line tables. Keeps panic backtraces with file:line — all an agent-driven
# workflow needs — while shrinking the .pdb / debug-section footprint that
# was the single biggest chunk of the multi-GB debug cache. Release is
# unaffected (it strips symbols).
debug = "line-tables-only"

# Vendored fork of tauri-runtime-wry 2.11.2 with three changes, documented in
# vendor/tauri-runtime-wry/FLEETIFY_PATCH.md: the Linux embedded browser
# (right-panel webview) can be positioned instead of stacking full-width at the
# bottom of the window (upstream bug: tauri-apps/tauri #13071 / #10420), on
# WebKitGTK a frame inside the app can't use the app page's IPC permissions
# through postMessage, and the embedded browser gets no Tauri IPC at all.
# Everything else is a verbatim copy of the published crate. Remove this patch
# (and the vendor/ dir) once upstream covers all three. The version must stay
# equal to the tauri-runtime-wry that `tauri` pulls in, or Cargo will ignore
# the patch.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
