# Advisories that OSV, and the OpenSSF Scorecard through it, would count
# against Fleetify but that don't affect the app: a feature or API nothing
# uses, a dev-only crate, or a crate that is unmaintained but has no known
# vulnerability. Each one mirrors an ignore in deny.toml, where cargo-deny's
# triage lives, and scripts/ci/check-advisory-ignores.test.mjs keeps the two
# files in step.
#
# Not here, so OSV keeps counting it: RUSTSEC-2026-0459 (sqlx-sqlite 0.8's
# bundled SQLite), which the sqlx 0.9 bump fixes.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0594"
ignoreUntil = 2026-12-07
reason = "cookie 0.18.1 via tauri, tauri-runtime and wry: the advisory covers PrivateJar, which needs cookie's private feature, and nothing in the tree enables it; 0.18.3 replaces it once it is two weeks old"

