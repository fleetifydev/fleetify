<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Fleetify favicon — three stacked ascending chevrons.
       Uses #fff so it shows on dark browser tabs (default for tab
       icons in dark UIs); falls back via system theme on light tabs.
       Opacity gradient (1 / 0.5 / 0.25) gives the mark its rising
       motion read even at 16px. -->
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5  L12 3.5 L20 8.5"  opacity="1"/>
    <path d="M4 13.5 L12 8.5 L20 13.5" opacity="0.5"/>
    <path d="M4 18.5 L12 13.5 L20 18.5" opacity="0.25"/>
  </g>
</svg>
