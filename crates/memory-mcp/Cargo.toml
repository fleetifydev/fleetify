[package]
name = "memory-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fleet-memory-mcp"
path = "src/main.rs"

[dependencies]
# Trimmed tokio: this sidecar is a single-threaded stdio JSON-RPC loop
# (current_thread runtime) + reqwest. It needs none of tokio "full"
# (no fs/process/signal/net/multi-thread of its own; reqwest pulls what
# IT needs transitively). Cuts the per-binary runtime surface vs the
# workspace `full` default.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
