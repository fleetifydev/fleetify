[package]
name = "browser-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fleet-browser-mcp"
path = "src/main.rs"

[dependencies]
# Trimmed tokio: single-threaded stdio JSON-RPC loop + reqwest only.
# See memory-mcp/Cargo.toml for the rationale.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# fleetify_core::loopback: the no-proxy client builder for calls to the backend.
fleetify-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
