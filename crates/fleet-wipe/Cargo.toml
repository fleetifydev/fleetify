[package]
name = "fleet-wipe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Linux: builds before the Secret Service store kept credentials in the
# KERNEL keyring (keyring crate's linux-keyutils backend), which `secret-tool`
# can't see. We enumerate it directly and invalidate leftover Fleetify keys.
# Secret Service items are not cleared here.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = "0.2"

# macOS (Keychain) / Windows (Credential Manager): delete the fixed login
# entry via the same `keyring` crate the app uses, as a belt-and-suspenders to
# wipe.mjs's `security` / `cmdkey` enumeration. Feature set mirrors src-tauri
# so the backend resolves identically.
[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
