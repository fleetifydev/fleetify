[package]
name = "fleetify-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# `loopback::http_client_builder`, the one builder every client of the app's
# own backend uses (the shell and the MCP sidecars). No features: each user
# brings its own TLS and json features.
reqwest = { version = "0.12", default-features = false }
# `process::tokio_command`, behind the `tokio` feature: the crates that start
# child processes with tokio turn it on, and the MCP sidecars, which start none,
# keep their trimmed tokio.
tokio = { version = "1", default-features = false, features = ["process"], optional = true }

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
tokio.workspace = true
