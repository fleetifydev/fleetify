[package]
name = "fleetify-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fleetify-core.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
futures-util = "0.3"
regex = "1"
open = "5"
rand = "0.8"
# Used by the Gemini bridge to resolve the `gemini` binary explicitly on
# Windows (where PATH resolution for .cmd wrappers via Command differs).
which = "6"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
