[package]
name = "fleetify-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fleetify-core.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
chromiumoxide = "0.9"
http = "1"
regex = "1"
# shellexecute-on-windows: `that_detached` opens through ShellExecuteExW, not
# `cmd /c start`, which would act on `"`, `&` and `%` in what it opens.
# Only `open_external` may call it (clippy.toml).
open = { version = "5", features = ["shellexecute-on-windows"] }
url = "2"
rand = "0.8"
parking_lot = "0.12"
# Used by the Gemini bridge to resolve the `gemini` binary explicitly on
# Windows (where PATH resolution for .cmd wrappers via Command differs).
which = "6"
# `agentic::executor` uses walkdir + glob for grep / glob tool impls — pure
# Rust, no external `rg` / `find` shellout, so the agent works on a clean
# Windows install without a unix toolchain.
walkdir = "2"
glob = "0.3"
# Antigravity SDK bridge reads `GEMINI_API_KEY` from the OS keyring under
# `Fleetify-Provider-antigravity-sdk` — same store the Tauri shell writes
# to via providers_link, so a single source of truth flows through.
# One feature set for every crate (src-tauri, fleet-wipe): Keychain on macOS,
# Credential Manager on Windows, Secret Service on Linux. Plain `linux-native`
# (the kernel keyring) is in-memory and loses every credential on reboot. The
# Secret Service store needs libdbus-1-dev + pkg-config to build on Linux;
# `crypto-rust` encrypts secrets on the D-Bus wire.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
# Loads `.env` (workspace root) into the process environment at server
# startup in debug builds, so single-source dev config (POSTHOG_API_KEY,
# POSTHOG_HOST, …) works without a wrapper shell script. No-op when `.env`
# is absent. Release builds never read it; CI release builds compile the
# PostHog key and host in instead (`option_env!`), and a value set in the
# environment at run time still wins over the compiled-in one.
dotenvy = "0.15"
# Pseudo-terminal (ConPTY on Windows, openpty on Unix) for the
# Antigravity CLI bridge: agy writes its interactive OAuth banner +
# sign-in URL straight to the console (CONOUT$), bypassing redirected
# stdout/stderr pipes — the only way to capture it AND feed the pasted
# code back is to give agy a real terminal that we own.
portable-pty = "0.8"

# open_external decides WSL the way the open crate does before it tries
# wslview (open 5.3.5 unix.rs): the same crate.
[target.'cfg(target_os = "linux")'.dependencies]
is-wsl = "0.4"

# Windows-only: read the user's canonical (Machine + User) registry PATH so
# spawned CLI agents get the clean PATH a fresh terminal would have — NOT the
# bloated runtime PATH our deep launch chain (npm -> cross-env -> tauri ->
# cargo) accumulates (~17k chars / 180 entries on a dev box). cmd.exe — which
# runs the agents' npm `.cmd` shims and their internal `chcp`/shell-outs —
# truncates a PATH over 8191 chars, dropping `node`/`git` and killing the agent
# at startup ("ACP stream closed: 'node' is not recognized").
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
# Captures log lines in tests that pin what is never logged.
tracing-subscriber.workspace = true
wiremock = "0.6"
