[package]
name = "fleetify-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fleetify-core.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
http = "1"
regex = "1"
open = "5"
rand = "0.8"
parking_lot = "0.12"
# Used by the Gemini bridge to resolve the `gemini` binary explicitly on
# Windows (where PATH resolution for .cmd wrappers via Command differs).
which = "6"
# `agentic::executor` uses walkdir + glob for grep / glob tool impls — pure
# Rust, no external `rg` / `find` shellout, so the agent works on a clean
# Windows install without a unix toolchain.
walkdir = "2"
glob = "0.3"
# Antigravity SDK bridge reads `GEMINI_API_KEY` from the OS keyring under
# `Fleetify-Provider-antigravity-sdk` — same store the Tauri shell writes
# to via providers_link, so a single source of truth flows through.
# `windows-native` keeps the credential in the Windows Credential Manager
# (Tauri shell uses the same feature set).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Loads `.env` (workspace root) into the process environment at server
# startup so single-source dev config (POSTHOG_API_KEY, POSTHOG_HOST, …)
# works without a wrapper shell script. No-op when `.env` is absent —
# real production builds inject env via the shell as before.
dotenvy = "0.15"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
