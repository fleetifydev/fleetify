[package]
name = "fleetify-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fleetify_app_lib"
# `staticlib` dropped: the desktop bin links this crate as an rlib and
# nothing consumes the ~2.5 GB debug staticlib (no iOS/`gen/apple` build
# exists). `cdylib` kept for forward mobile compat. Re-add "staticlib"
# if/when an iOS target lands.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleetify-core = { workspace = true, features = ["tokio"] }
fleetify-backend.workspace = true
tauri = { version = "2", features = ["macos-private-api", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
# Opening Fleetify while it runs focuses the running window instead of
# starting a second copy (release builds only, see lib.rs). Cargo.lock holds
# 2.4.5, the newest release that works with tauri 2.11: 2.5 needs tauri 2.12.
tauri-plugin-single-instance = "2"
# In-app updates (shell::updater). 2.12 is the newest release for tauri 2.11:
# 2.13 needs tauri 2.12, which would drop the vendored tauri-runtime-wry patch
# (root Cargo.toml). No default features: `zip` serves only v1-format updates
# and would bring zip 4 back.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio.workspace = true
tracing.workspace = true
# Workspace already pins tracing-subscriber@0.3 with env-filter + json
# features, both of which the file logger relies on.
tracing-subscriber.workspace = true
tracing-appender = "0.2"
# Used by logs_export to bundle logs + system info into a single zip
# the user can attach to a bug report.
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# Same feature set as fleetify-backend (rationale there): the Secret Service
# store keeps Linux sign-in and provider keys across reboots.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tiny_http = "0.12"
url = "2"
# Decodes the request paths the embedded UI files are looked up by
# (shell::ui_files). Already in the tree through url and tauri.
percent-encoding = "2"
arboard = "3"
portable-pty = "0.9"
# `shell_install_provider` resolves the user's Python via PATHEXT-aware
# lookup before piping a pip install — matches how fleetify-backend
# locates CLI binaries so install + dispatch agree on the interpreter.
which = "6"
uuid = { version = "1", features = ["v4"] }
# .git/HEAD watcher for the renderer's branch strip — debouncer-mini
# wraps `notify` and collapses the double-write that `git checkout`
# produces into a single UI event.
notify = "6"
notify-debouncer-mini = "0.4"
# GitHub link manager needs chrono for the connected_at / expires_at
# timestamps the cloud expects (Z-suffix RFC 3339, matches Electron).
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Voice dictation — native mic capture (cpal, always enabled) +
# on-device Whisper engine (whisper.cpp via whisper-rs, optional) +
# WAV decode for local engine (hound, optional). cpal uses WASAPI on
# Windows (no extra system deps); ALSA/PulseAudio headers needed on Linux.
cpal = "0.15"
whisper-rs = { version = "0.16.0", optional = true }
hound = { version = "3.5.1", optional = true }

# macOS only: unlocks WKWebView's 60 FPS cap on macOS 13–15 so
# CSS animations, scrolling, requestAnimationFrame, and xterm
# rendering run at the display's native refresh rate (120 Hz on
# ProMotion MacBooks, 144/240 Hz on external monitors). On macOS 26+
# Apple removed the cap upstream and the plugin no-ops. The plugin
# toggles WebKit's private `PreferPageRenderingUpdatesNear60FPSEnabled`
# feature flag via the same private `_features` API Safari uses
# internally — there is no public API equivalent. That makes the
# binary ineligible for the Mac App Store, which we don't ship to
# anyway (DMG + Homebrew + GitHub releases per Phase 5 packaging).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-fps = "0.1"
# The main window's open animation (setup() in lib.rs). Already in the tree
# through tauri-runtime-wry and tao; this names the NSWindow API it uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

# Windows only: the notification-area icon (shell::tray), which opens the
# window again once a close has hidden it, and quits. Not on Linux, where
# tauri's `tray-icon` feature loads libayatana-appindicator at run time (and
# panics without it), and its bundler would then require the library; nor
# on macOS, where the Dock does the icon's job. Only the [dependencies]
# entry above names the features that tauri.conf.json controls: tauri-build
# and the Tauri CLI check and rewrite that one, never this one.
# winreg (fleetify-backend's version) reads the taskbar's theme, and the
# windows-sys its RegKey handles come from waits for it to change (winreg has
# no wrapper for RegNotifyChangeKeyValue): an event from CreateEventW, which
# needs Win32_Security for its attributes, and WaitForSingleObject. Both are
# already in the tree. Bump them together: a RegKey handle is that
# windows-sys's HKEY.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

# x11-dl: install a non-fatal X error handler (see setup() in lib.rs) — GDK
# aborts the whole app on any async X error otherwise. Already in the
# lockfile via tao/wry.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
# The single-instance plugin's D-Bus library, so lib.rs can check that it
# reads the session bus address before registering the plugin, whose Linux
# setup panics when it can't. Keep it on the plugin's zbus version (a test in
# lib.rs checks Cargo.lock). Remove it, with that check, once
# tauri-plugin-single-instance is 2.5.4 or later.
zbus = "5.9"

[dev-dependencies]
tempfile = "3"
# The vendored runtime (root Cargo.toml's [patch.crates-io]), for the tests of
# its postMessage IPC and IPC-free Browser panel patches
# (vendor/tauri-runtime-wry/FLEETIFY_PATCH.md).
# No features: tauri enables the ones it needs.
tauri-runtime-wry = { version = "2", default-features = false }

[features]
# On-device Whisper ships by DEFAULT so the offline voice engine works out
# of the box on every platform (Windows/macOS/Linux, CPU backend). This
# statically links whisper.cpp/ggml (~10-22 MB) and needs a cmake/C++
# toolchain at build time. The heavy cost — loading a 150 MB–1.6 GB model
# into RAM — only happens if the user actually selects/downloads an
# on-device model (opt-in in Settings → Voice); the broker/byok cloud
# engines remain the zero-RAM path otherwise.
# For a lean cloud-only build (no whisper.cpp, no toolchain required):
#   cargo build --no-default-features      (or drop it from tauri build)
default = ["local-whisper"]
local-whisper = ["dep:whisper-rs", "dep:hound"]
# Opt a RELEASE build into the embedded-webview devtools (browser_embed_devtools).
# Debug builds always have them; this just declares the cfg so the
# `#[cfg(feature = "devtools")]` gates aren't "unexpected_cfgs" warnings.
devtools = []
