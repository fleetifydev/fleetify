[package]
name = "fleetify-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fleetify_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleet-core.workspace = true
fleet-backend.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# Windows is the current build/dev target; per-OS backends (apple-native /
# sync-secret-service) get added behind cfg in Phase 5 packaging.
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"
tiny_http = "0.12"
url = "2"
arboard = "3"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
