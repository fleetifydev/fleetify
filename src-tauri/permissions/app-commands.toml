# Every app command. capabilities/default.json grants this set to the main
# webview from local origins, and the capability setup adds grants it from
# the app's own origin (src/shell/startup_window.rs). tauri-build generates
# each allow-* from the command list in src/app_commands.rs; a test keeps
# this set equal to it.

[[set]]
identifier = "app-commands"
description = "Allows every command the app registers."
permissions = [
  "allow-auth-sign-in",
  "allow-auth-sign-out",
  "allow-auth-userinfo",
  "allow-auth-get-access-token",
  "allow-auth-get-state",
  "allow-config-get",
  "allow-config-set",
  "allow-telemetry-get-config",
  "allow-telemetry-set-posthog-enabled",
  "allow-telemetry-set-cloud-enabled",
  "allow-shell-open-external",
  "allow-shell-show-item-in-folder",
  "allow-shell-open-path",
  "allow-detect-editors",
  "allow-open-in-editor",
  "allow-clipboard-write",
  "allow-browser-embed-create",
  "allow-browser-embed-navigate",
  "allow-browser-embed-set-bounds",
  "allow-browser-embed-set-select",
  "allow-browser-embed-nav",
  "allow-browser-embed-devtools",
  "allow-browser-embed-clear-data",
  "allow-browser-embed-close",
  "allow-window-start-dragging",
  "allow-window-minimize",
  "allow-window-maximize",
  "allow-window-close",
  "allow-window-set-size",
