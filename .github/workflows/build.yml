# Builds Fleetify's release bundles, for the release dry run
# (release-dry-run.yml) and the release. Each target is compiled in a job
# that holds no key, and signed in a job that runs nothing it didn't check:
# - compile builds the app, its sidecars and the UI, which runs the code of
#   every dependency: crate build scripts, proc macros, Vite plugins. It runs
#   in no environment and sees no secret. On Linux and Windows it also makes
#   the bundles, without signing them, and uploads unsigned-<triple>; on
#   macOS, whose bundles carry the signature inside, it uploads the app and
#   its sidecars as compiled-<triple>.
# - sign, for Linux and Windows, and bundle-macos, for macOS, run in the
#   environment the caller names, which holds the signing keys. They run
#   only GitHub's own actions, pinned to a commit, the Tauri CLI the
#   lockfile pins (npx --no -- tauri: npx downloads nothing, and reads none
#   of the flags after tauri), system tools and the repository's scripts. Each downloads an artifact into a folder
#   of its own and checks that it holds exactly the files expected before it
#   uses one; bundle-macos also reads compiled.tar member by member before
#   it copies the listed files into the checkout. sign signs the updater
#   artifacts with the Tauri CLI's signer; bundle-macos bundles and signs
#   the app, and is the only job with the macOS identity. Each updater
#   signature names the release's version, which the signature covers and
#   the updater compares with the version it is offered.
# npm installs everywhere with --ignore-scripts: no install script runs.
# Each of the two uploads bundles-<triple>: that target's files under their
# release names (scripts/release/release-assets.mjs), which assemble.mjs
# turns into a release together with the third-party-notices artifact.
#
# The environment input picks the signing keys:
# - release: the updater key and the macOS identity of the release
#   environment, whose deployments wait for the owner's approval.
# - dry-run: keys made for the run, and an updater overlay
#   (dry-run-config.mjs) whose only endpoint is the smoke's update server on
#   127.0.0.1, over plain http. The run's updater key stays among the run's
#   artifacts for a day, as only this run's builds trust it; the macOS
#   identity goes with the job. What the run builds stays in its artifacts.
# Either way the build starts from a clean target folder, without a cache.
#
# Every job uses the Tauri CLI directly, so the asset names stay the ones
# release-assets.mjs gives, and no third-party action handles the keys.
name: Build release bundles

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        required: true
        type: string
      environment:
        description: "release (the release keys) or dry-run (keys made for the run)"
        required: true
        type: string
      version:
        description: The version the bundles carry, MAJOR.MINOR.PATCH, as in package.json.
        required: true
        type: string
    # The signing keys live only in the release environment. A secret like
    # that reaches a called workflow's job only when the caller passes it by
    # name (unpassed, it resolves to an empty string, with no error), and its
    # value then comes from the environment that job names: sign and
    # bundle-macos get the keys in a release build alone. A dry run passes
    # them too, empty, and signs with keys made for the run. Each release
    # step that gets one first fails on any that is empty, naming it.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cargo colours its output only on a terminal, which a job's log isn't.
env:
  CARGO_TERM_COLOR: always

jobs:
  notices:
    name: Third-party notices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Every job after this one needs it, so a bad input stops the run before
      # any job enters an environment.
      - name: Check the inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$ENVIRONMENT" in
            release | dry-run) ;;
            *)
              echo "::error::environment is '$ENVIRONMENT', not release or dry-run"
              exit 1
              ;;
          esac
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version is '$VERSION', not MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # A prebuilt binary, checked against the checksum the action carries.
      - name: Install cargo-about
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.3
          fallback: none
      # The notices read the npm packages' licence files and the crates'
      # sources, so both are fetched first; no install script runs.
      - name: Fetch the npm packages and the crates
        run: |
          npm ci --ignore-scripts
          cargo fetch --locked
      - name: Write THIRD-PARTY-NOTICES
        run: node scripts/release/third-party-notices.mjs --out THIRD-PARTY-NOTICES
      - name: Upload the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES
          if-no-files-found: error
          retention-days: 7

  compile:
    name: Compile (${{ matrix.label }})
    needs: notices
    runs-on: ${{ matrix.runner }}
    # The Linux leg builds in an Ubuntu 22.04 container on a newer runner, so
    # that its bundles need no glibc newer than 2.35, which the glibc check
    # below enforces. The others name no container and build on the runner.
    container: ${{ matrix.container }}
    # A cold build compiles the whole workspace in release mode, whisper.cpp
    # and the fat LTO link included.
    timeout-minutes: 120
    strategy:
      # Each target reports on its own, so one failing doesn't cancel the rest.
      fail-fast: false
      # release-assets.mjs's TARGETS, which a script test keeps this list equal to.
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            # ubuntu:22.04's image index, as published on 2026-11-17.
            container: ubuntu:22.04@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6
            bundles: [appimage, deb, rpm]
            label: Linux x64
          - triple: x86_64-pc-windows-msvc
            runner: windows-2025
            bundles: [nsis]
            label: Windows x64
          - triple: aarch64-apple-darwin
            runner: macos-15
            bundles: [app, dmg]
            label: macOS Apple Silicon
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
            bundles: [app, dmg]
            label: macOS Intel
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      TRIPLE: ${{ matrix.triple }}
      BUNDLES: ${{ join(matrix.bundles, ',') }}
    steps:
      # The container starts as Ubuntu's base system, without git, which
      # checkout clones with, or the tools that the next steps fetch with.
      - name: Base packages (Linux container)
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The runner images come with rustup and the container doesn't. This
      # is rustup's own installer at a pinned release, checked against its
      # SHA-256 before it runs, and it installs no toolchain: the next step
      # installs rust-toolchain.toml's.
      - name: rustup (Linux container)
        if: matrix.container
        env:
          RUSTUP_VERSION: "1.29.3"
          RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
        run: |
          init="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$init" "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $init" | sha256sum --check --strict -
          chmod +x "$init"
          "$init" -y --no-modify-path --profile minimal --default-toolchain none
          rm "$init"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # No Rust cache, in a dry run either: a release builds from a clean
      # target folder, with no cache to trust, and the dry run rehearses it.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # CONTRIBUTING.md's Linux packages, which a script test keeps in step
      # with this list. The AppImage carries the libraries the app links to,
      # which linuxdeploy copies from this system: the container's Ubuntu
      # 22.04, where the job runs as root, with no sudo.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential curl wget file pkg-config cmake libclang-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev patchelf
      # No install script runs: none of the build needs one.
      - name: npm packages
        run: npm ci --ignore-scripts
      # tauri-build checks at compile time that every bundled resource is
      # there: tauri.release.conf.json bundles ./THIRD-PARTY-NOTICES.
      - name: Download the notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/notices
      - name: Check the notices and put them in place
        run: |
          node scripts/release/check-artifact.mjs "$RUNNER_TEMP/notices" THIRD-PARTY-NOTICES
          cp "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES" THIRD-PARTY-NOTICES
      # A dry run signs its updates with a key made for the run. The overlay
      # gives the updater that key's public half and one endpoint, the
      # smoke's update server on 127.0.0.1:18080, which speaks plain http.
      # Both are compiled into the app. Only the key goes to the jobs that
      # sign; bundle-macos makes the overlay again from the public key.
      - name: Updater key and overlay for this run (dry run)
        if: inputs.environment == 'dry-run'
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run" "$RUNNER_TEMP/dry-run-config"
          npx --no -- tauri signer generate --ci -p "" -w "$RUNNER_TEMP/dry-run/updater.key" > /dev/null
          node scripts/release/dry-run-config.mjs --pubkey-file "$RUNNER_TEMP/dry-run/updater.key.pub" --out "$RUNNER_TEMP/dry-run-config/dry-run.json"
      - name: Stage the MCP sidecars
        run: node scripts/build-sidecars.mjs --release --target "$TRIPLE"
      # The app, with the UI built in.
      - name: Compile the app (release)
        if: inputs.environment == 'release'
        env:
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: npx --no -- tauri build --ci --target "$TRIPLE" --no-bundle --config src-tauri/tauri.release.conf.json
      - name: Compile the app (dry run)
        if: inputs.environment == 'dry-run'
        env:
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: >-
          npx --no -- tauri build --ci --target "$TRIPLE" --no-bundle
          --config src-tauri/tauri.release.conf.json --config "$RUNNER_TEMP/dry-run-config/dry-run.json"
      # A private key or token that got into the build would ship in the UI
      # bundle or a binary. The bundles themselves are compressed, which a
      # text scan can't read, so it reads what goes into them.
      - name: Scan the build for secrets
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          node scripts/release/scan-secrets.mjs dist "target/$TRIPLE/release/fleetify-app$exe" target/"$TRIPLE"/release/fleet-*-mcp"$exe"
      # The updater settings the app was built with. A release must carry
      # the pubkey and the endpoints that src-tauri/tauri.conf.json ships,
      # and never the dry run's overlay: assemble checks signatures, which a
      # release build makes with the release key whatever it was built with.
      # The overlay's endpoint is its marker. Its other key,
      # dangerousInsecureTransportProtocol, can't be one: every build holds
      # that name, among the updater plugin's own field names. A dry run
      # must carry the marker, which shows the check can see what was built in.
      - name: Check the updater settings built in
        run: |
          bin="target/$TRIPLE/release/fleetify-app"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          marker="127.0.0.1:18080/update"
          has() { grep -aqF -e "$1" -- "$bin"; }
          if [ "$ENVIRONMENT" = release ]; then
            if has "$marker"; then
              echo "::error::$bin has the dry run's update endpoint ($marker)"
              exit 1
            fi
            shipped=$(node -e 'const u = require("./src-tauri/tauri.conf.json").plugins.updater; console.log([u.pubkey, ...u.endpoints].join("\n"))')
            while IFS= read -r value; do
              if ! has "$value"; then
                echo "::error::$bin lacks $value, which src-tauri/tauri.conf.json ships"
                exit 1
              fi
            done <<< "$shipped"
            echo "$bin has the shipped updater settings, and not the dry run's"
          else
            if ! has "$marker"; then
              echo "::error::$bin lacks the dry run's update endpoint ($marker), so this check can't see what was built in"
              exit 1
            fi
            echo "$bin has the dry run's update endpoint"
          fi
      # The bundler downloads the tools that make the AppImage into its cache
      # whenever they're missing, unchecked, and two of them ship inside it:
      # these are the ones appimage-tools.json pins by SHA-256.
      - name: Install the pinned AppImage tools (Linux)
        if: runner.os == 'Linux'
        run: node scripts/release/appimage-tools.mjs
      # Linux and Windows bundles carry no signature inside, so they're made
      # here, with no key: --no-sign leaves out the updater signatures, which
      # the sign job adds. --verbose logs each command the bundler runs
      # (linuxdeploy, makensis). The Linux container has no FUSE to mount an
      # AppImage with, so linuxdeploy and its plugins, AppImages themselves,
      # extract themselves and run from there.
      - name: Bundle without signing (Linux and Windows release)
        if: runner.os != 'macOS' && inputs.environment == 'release'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --no -- tauri bundle --no-sign --verbose --ci --target "$TRIPLE" --bundles "$BUNDLES" --config src-tauri/tauri.release.conf.json
      - name: Bundle without signing (Linux and Windows dry run)
        if: runner.os != 'macOS' && inputs.environment == 'dry-run'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >-
          npx --no -- tauri bundle --no-sign --verbose --ci --target "$TRIPLE" --bundles "$BUNDLES"
          --config src-tauri/tauri.release.conf.json --config "$RUNNER_TEMP/dry-run-config/dry-run.json"
      # The pinned linuxdeploy copies in libwayland-client, which a newer
      # system's Mesa needs its own copy of: with the AppImage's loaded,
      # WebKit can't draw and the window stays blank. This takes the
      # libraries the system must provide out of the AppImage and repacks
      # it, before anything checks, collects, signs or lists it.
      - name: Take the system's libraries out of the AppImage (Linux)
        if: runner.os == 'Linux'
        run: node scripts/release/appimage-exclude.mjs --dir "target/$TRIPLE/release/bundle/appimage"
      # docs/INSTALL.md promises Ubuntu 22.04, whose glibc is 2.35. A file
      # built here, or a library the AppImage copies from this system, may
      # need any glibc up to this system's, so a newer system, runner or
      # container, could make bundles that don't start there, with nothing
      # else failing.
      # glibc-floor.mjs fails on any ELF file that needs a glibc newer than
      # 2.35 or glibc's private interface, or isn't x86-64: the app and the
      # sidecars, which the .deb and the .rpm carry too, and each one inside
      # the AppImage that ships, as the step above repacked it, extracted
      # without FUSE into a folder that goes once the check is done.
      - name: Check the glibc the build needs (Linux)
        if: runner.os == 'Linux'
        run: |
          appimages=("$PWD/target/$TRIPLE/release/bundle/appimage/"*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "::error::expected one AppImage, found: ${appimages[*]}"
            exit 1
          fi
          extract="$RUNNER_TEMP/glibc-floor"
          mkdir -p "$extract"
          (cd "$extract" && "${appimages[0]}" --appimage-extract > /dev/null)
          status=0
          node scripts/release/glibc-floor.mjs "target/$TRIPLE/release/fleetify-app" target/"$TRIPLE"/release/fleet-*-mcp "$extract/squashfs-root" || status=$?
          rm -rf "$extract"
          exit "$status"
      # Into a folder of its own first: collect-bundles.mjs fills only an
      # empty one, so the artifact holds only this build's files.
      - name: Collect the unsigned bundles (Linux and Windows)
        if: runner.os != 'macOS'
        run: node scripts/release/collect-bundles.mjs --unsigned --target "$TRIPLE" --version "$VERSION" --out "$RUNNER_TEMP/unsigned"
      # The system libraries inside the AppImage and the Ubuntu packages they
      # come from, read on the system that built it, whose dpkg knows them.
      - name: List the AppImage's libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          appimages=("$PWD/target/$TRIPLE/release/bundle/appimage/"*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "::error::expected one AppImage, found: ${appimages[*]}"
            exit 1
          fi
          extract="$RUNNER_TEMP/appimage"
          mkdir -p "$extract"
          (cd "$extract" && "${appimages[0]}" --appimage-extract > /dev/null)
          node scripts/release/appimage-libraries.mjs --root "$extract/squashfs-root" --out "$RUNNER_TEMP/unsigned/LINUX-APPIMAGE-LIBRARIES.txt"
      # Kept a week, as a release's approval can come days after the build.
      - name: Upload the unsigned bundles (Linux and Windows)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.triple }}
          path: ${{ runner.temp }}/unsigned
          if-no-files-found: error
          retention-days: 7
      # What the macOS bundler needs, as compiled-tar.mjs lists it: the app
      # and each sidecar Tauri bundles. In ustar, which the bundle job's
      # check reads, with no ._* entries for macOS's metadata; tar keeps the
      # binaries executable, which an artifact's zip doesn't. The bundle
      # job's check runs here too, so a problem with the archive shows first
      # in this job.
      - name: Pack the compiled files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/compiled"
          node scripts/release/compiled-tar.mjs list --target "$TRIPLE" > "$RUNNER_TEMP/compiled-files.txt"
          tar --format ustar --no-mac-metadata -cf "$RUNNER_TEMP/compiled/compiled.tar" -T "$RUNNER_TEMP/compiled-files.txt"
          node scripts/release/compiled-tar.mjs unpack --target "$TRIPLE" --tar "$RUNNER_TEMP/compiled/compiled.tar" --out "$RUNNER_TEMP/compiled-check"
          rm -rf "$RUNNER_TEMP/compiled-check"
      - name: Upload the compiled files (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-${{ matrix.triple }}
          path: ${{ runner.temp }}/compiled/compiled.tar
          if-no-files-found: error
          retention-days: 7
      # The jobs that sign do so with the run's key. Only this run's dry-run
      # builds trust it, so a copy among the run's own artifacts, kept for a
      # day, puts nothing else at risk.
      - name: Upload the run's updater key (dry run)
        if: inputs.environment == 'dry-run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-key-${{ matrix.triple }}
          path: ${{ runner.temp }}/dry-run
          if-no-files-found: error
          retention-days: 1
      - name: Delete the run's updater key (dry run)
        if: always() && inputs.environment == 'dry-run'
        run: rm -f "$RUNNER_TEMP/dry-run/updater.key" "$RUNNER_TEMP/dry-run/updater.key.pub" "$RUNNER_TEMP/dry-run-config/dry-run.json"

  sign:
    name: Sign (${{ matrix.label }})
    # needs on a matrix job waits for every leg of it, so one compile leg
    # that fails skips every leg of this job, and of bundle-macos.
    needs: compile
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    strategy:
      # Each target reports on its own, so one failing doesn't cancel the rest.
      fail-fast: false
      # release-assets.mjs's Linux and Windows TARGETS, which a script test
      # keeps this list equal to.
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            label: Linux x64
          - triple: x86_64-pc-windows-msvc
            label: Windows x64
    env:
      VERSION: ${{ inputs.version }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      # The repository's checks, and the updater pubkey a release must match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # For the Tauri CLI's signer. No install script runs.
      - name: npm packages
        run: npm ci --ignore-scripts
      - name: Download the unsigned bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ matrix.triple }}
          path: ${{ runner.temp }}/bundles
      # Exactly the files release-assets.mjs names for the target, each a
      # regular file.
      - name: Check the unsigned bundles
        run: |
          expected=$(node scripts/release/release-assets.mjs unsigned "$TRIPLE" "$VERSION")
          names=()
          while IFS= read -r name; do names+=("$name"); done <<< "$expected"
          node scripts/release/check-artifact.mjs "$RUNNER_TEMP/bundles" "${names[@]}"
      - name: Download the run's updater key (dry run)
        if: inputs.environment == 'dry-run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-key-${{ matrix.triple }}
          path: ${{ runner.temp }}/dry-run
      - name: Check the run's updater key (dry run)
        if: inputs.environment == 'dry-run'
        run: node scripts/release/check-artifact.mjs "$RUNNER_TEMP/dry-run" updater.key updater.key.pub
      # The Tauri CLI's signer writes each <file>.sig as the bundler would,
      # with the same function and trusted comment: --app-version adds the
      # release's version to that comment, which the signature covers, as
      # tauri bundle does on its own. The updater refuses a signature whose
      # version isn't the one the update endpoint announces, and the shipped
      # config (requireSignedVersion) one that names no version. The release
      # key reaches the signer through the environment, never as an
      # argument. Each call gets /dev/null for input, so nothing reads the
      # loop's list. A key arrives empty when the release environment lacks
      # it or the caller doesn't pass it, which the signer reports as a bad
      # password, so the step first names each empty one, never a value.
      - name: Sign the updater artifacts (release)
        if: inputs.environment == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: the release environment must hold it and build.yml's caller must pass it by name (see on.workflow_call.secrets)"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then exit 1; fi
          updaters=$(node scripts/release/release-assets.mjs updaters "$TRIPLE" "$VERSION")
          while IFS= read -r name; do
            npx --no -- tauri signer sign --app-version "$VERSION" "$RUNNER_TEMP/bundles/$name" < /dev/null
          done <<< "$updaters"
      - name: Sign the updater artifacts (dry run)
        if: inputs.environment == 'dry-run'
        run: |
          updaters=$(node scripts/release/release-assets.mjs updaters "$TRIPLE" "$VERSION")
          while IFS= read -r name; do
            npx --no -- tauri signer sign -f "$RUNNER_TEMP/dry-run/updater.key" -p "" --app-version "$VERSION" "$RUNNER_TEMP/bundles/$name" < /dev/null
          done <<< "$updaters"
      # Each signature verifies against the key the release's updater trusts,
      # or in a dry run the run's own, and names the release's version.
      - name: Check the updater signatures (release)
        if: inputs.environment == 'release'
        run: |
          updaters=$(node scripts/release/release-assets.mjs updaters "$TRIPLE" "$VERSION")
          files=()
          while IFS= read -r name; do files+=("$RUNNER_TEMP/bundles/$name"); done <<< "$updaters"
          node scripts/release/minisign.mjs verify --pubkey-config src-tauri/tauri.conf.json --expect-key-id 44C694713A20D751 --version "$VERSION" "${files[@]}"
      - name: Check the updater signatures (dry run)
        if: inputs.environment == 'dry-run'
        run: |
          updaters=$(node scripts/release/release-assets.mjs updaters "$TRIPLE" "$VERSION")
          files=()
          while IFS= read -r name; do files+=("$RUNNER_TEMP/bundles/$name"); done <<< "$updaters"
          node scripts/release/minisign.mjs verify --pubkey-file "$RUNNER_TEMP/dry-run/updater.key.pub" --version "$VERSION" "${files[@]}"
      # assemble.mjs checks each dry-run build's signatures against its own key.
      - name: Add the run's updater public key (dry run)
        if: inputs.environment == 'dry-run'
        run: cp "$RUNNER_TEMP/dry-run/updater.key.pub" "$RUNNER_TEMP/bundles/updater-pubkey.txt"
      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.triple }}
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error
          retention-days: 7
      - name: Delete the run's updater key (dry run)
        if: always() && inputs.environment == 'dry-run'
        run: rm -f "$RUNNER_TEMP/dry-run/updater.key" "$RUNNER_TEMP/dry-run/updater.key.pub"

  bundle-macos:
    name: Bundle (${{ matrix.label }})
    # needs on a matrix job waits for every leg of it, so one compile leg
    # that fails skips every leg of this job, and of sign.
    needs: compile
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    strategy:
      # Each target reports on its own, so one failing doesn't cancel the rest.
      fail-fast: false
      # release-assets.mjs's macOS TARGETS, which a script test keeps this
      # list equal to.
      matrix:
        include:
          - triple: aarch64-apple-darwin
            runner: macos-15
            bundles: [app, dmg]
            label: macOS Apple Silicon
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
            bundles: [app, dmg]
            label: macOS Intel
    env:
      VERSION: ${{ inputs.version }}
      TRIPLE: ${{ matrix.triple }}
      BUNDLES: ${{ join(matrix.bundles, ',') }}
    steps:
      # The config, the icons, the entitlements and the bundled resources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # tauri bundle asks `cargo metadata --no-deps` where the target folder
      # is. That reads the manifests: it compiles nothing and runs no build
      # script.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # For the Tauri CLI. No install script runs.
      - name: npm packages
        run: npm ci --ignore-scripts
      - name: Download the compiled files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-${{ matrix.triple }}
          path: ${{ runner.temp }}/compiled-download
      # The artifact must be compiled.tar alone. compiled-tar.mjs reads it
      # member by member and writes the files it lists into an empty folder
      # only if every member is one of them, or a folder above one; the
      # folder must then hold nothing but those files. Only they are copied
      # into the checkout, executable.
      - name: Check and unpack the compiled files
        run: |
          node scripts/release/check-artifact.mjs "$RUNNER_TEMP/compiled-download" compiled.tar
          out="$RUNNER_TEMP/compiled"
          node scripts/release/compiled-tar.mjs unpack --target "$TRIPLE" --tar "$RUNNER_TEMP/compiled-download/compiled.tar" --out "$out"
          listed=$(node scripts/release/compiled-tar.mjs list --target "$TRIPLE")
          odd=$(find "$out" ! -type f ! -type d)
          if [ -n "$odd" ]; then
            echo "::error::the unpacked files hold more than files and folders: $odd"
            exit 1
          fi
          found=$(cd "$out" && find . -type f | sed -e 's|^\./||' | LC_ALL=C sort)
          if [ "$found" != "$(LC_ALL=C sort <<< "$listed")" ]; then
            echo "::error::the unpacked files aren't the ones compiled-tar.mjs lists: $found"
            exit 1
          fi
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            cp -p "$out/$file" "$file"
          done <<< "$listed"
      # tauri.release.conf.json bundles ./THIRD-PARTY-NOTICES as legal/THIRD-PARTY-NOTICES.
      - name: Download the notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/notices
      - name: Check the notices and put them in place
        run: |
          node scripts/release/check-artifact.mjs "$RUNNER_TEMP/notices" THIRD-PARTY-NOTICES
          cp "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES" THIRD-PARTY-NOTICES
      - name: Download the run's updater key (dry run)
        if: inputs.environment == 'dry-run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-key-${{ matrix.triple }}
          path: ${{ runner.temp }}/dry-run
      # The overlay is made here again from the run's public key, which
      # dry-run-config.mjs checks, rather than taken from the compile job.
      - name: Check the run's updater key and make the overlay (dry run)
        if: inputs.environment == 'dry-run'
        run: |
          node scripts/release/check-artifact.mjs "$RUNNER_TEMP/dry-run" updater.key updater.key.pub
          mkdir -p "$RUNNER_TEMP/dry-run-config"
          node scripts/release/dry-run-config.mjs --pubkey-file "$RUNNER_TEMP/dry-run/updater.key.pub" --out "$RUNNER_TEMP/dry-run-config/dry-run.json"
      # The Tauri CLI merges a platform config such as tauri.macos.conf.json
      # on its own, and tauri bundle runs a config's beforeBundleCommand: the
      # only configs here are the tracked ones, unchanged.
      - name: Check that the Tauri configs are the tracked ones
        run: |
          untracked=$(git ls-files --others -- 'src-tauri/tauri*.conf*' 'src-tauri/Tauri*.toml')
          if [ -n "$untracked" ]; then
            echo "::error::Tauri configs that aren't tracked are in the checkout: $untracked"
            exit 1
          fi
          git diff --exit-code -- 'src-tauri/tauri*.conf*' 'src-tauri/Tauri*.toml'
      # Each identity step gives up after five minutes, so a security
      # command waiting on a dialog fails the job with its logs kept.
      #
      # The signing identity goes into a keychain the job makes, and Tauri
      # signs with APPLE_SIGNING_IDENTITY alone, which codesign looks up in
      # the keychain search list; macos-keychain.sh sets both up and signs a
      # probe with the identity before Tauri runs. Tauri's own import,
      # through APPLE_CERTIFICATE, looks only for certificates named like
      # Apple's ("Developer ID Application: …", with an organizational unit),
      # so it can't find a self-signed one (tauri-macos-sign 2.3.4, which
      # tauri-cli 2.11.5 uses). A self-signed certificate is valid only where
      # it is trusted, so the script trusts it for code signing in the
      # System keychain. That setting stays: GitHub discards a hosted
      # runner's VM after the job, and removing the setting waits for an
      # authorization dialog no one can answer.
      #
      # A dry run makes an identity of its own, shaped like the release one,
      # and imports it the same way. It keeps the identities codesign can
      # see and the search list for codesign-output-<triple>, so a failed
      # signing leaves them even if the job's log is lost.
      - name: Code-signing identity for this run (dry run)
        if: inputs.environment == 'dry-run'
        timeout-minutes: 5
        env:
          IDENTITY: Fleetify Dry Run Code Signing
        run: |
          status=0
          bash scripts/release/macos-keychain.sh dry-run || status=$?
          out="$RUNNER_TEMP/codesign-output"
          mkdir -p "$out"
          security find-identity -v -p codesigning > "$out/find-identity.txt" 2>&1 || true
          security list-keychains -d user > "$out/list-keychains.txt" 2>&1 || true
          exit "$status"
      # The release identity, from the release environment. This step only
      # decodes the p12; its password reaches the script through the
      # environment. Either arrives empty when the release environment lacks
      # it or the caller doesn't pass it, which the script would report as a
      # missing password, so the step first names each empty one by the
      # secret to set, never a value.
      - name: Release code-signing identity (release)
        if: inputs.environment == 'release'
        timeout-minutes: 5
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE P12_PASSWORD; do
            if [ -z "${!name}" ]; then
              secret=$name
              if [ "$name" = P12_PASSWORD ]; then secret="APPLE_CERTIFICATE_PASSWORD, delivered as P12_PASSWORD,"; fi
              echo "::error::$secret is empty: the release environment must hold it and build.yml's caller must pass it by name (see on.workflow_call.secrets)"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then exit 1; fi
          dir="$RUNNER_TEMP/codesign"
          mkdir -p "$dir"
          chmod 700 "$dir"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$dir/release.p12"
          P12="$dir/release.p12" bash scripts/release/macos-keychain.sh import
          rm -f "$dir/release.p12"
      # The release keys: the updater key signs the updater artifact, for the
      # version in tauri.conf.json, and the identity the step above set up
      # signs the app. tauri bundle bundles the binaries the compile job
      # built; it doesn't rebuild them.
      # --verbose logs each command the bundler runs (codesign, hdiutil).
      # None takes a secret as an argument: the updater key reaches the CLI
      # through the environment, and the identity is a certificate's name.
      # The updater key and its password are checked first, as in sign.
      - name: Bundle (release)
        if: inputs.environment == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: the release environment must hold it and build.yml's caller must pass it by name (see on.workflow_call.secrets)"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then exit 1; fi
          npx --no -- tauri bundle --verbose --ci --target "$TRIPLE" --bundles "$BUNDLES" --config src-tauri/tauri.release.conf.json
      # The run's own keys, and the overlay the app was compiled with.
      - name: Bundle (dry run)
        if: inputs.environment == 'dry-run'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/dry-run/updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          npx --no -- tauri bundle --verbose --ci --target "$TRIPLE" --bundles "$BUNDLES"
          --config src-tauri/tauri.release.conf.json --config "$RUNNER_TEMP/dry-run-config/dry-run.json"
      # Right after the bundling, whatever happened: nothing after it signs,
      # and codesign's checks don't need the key.
      - name: Delete the signing keychain
        if: always()
        timeout-minutes: 5
        run: |
          if [ -n "${CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$CODESIGN_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/codesign"
      # The release identity's designated requirement is pinned: macOS keeps
      # the app's microphone permission and keychain items across an update
      # only while it stays the same. A dry run's identity is made for the
      # run, so only the requirement's shape is checked.
      - name: Check the macOS signature (release)
        if: inputs.environment == 'release'
        run: node scripts/release/macos-signature.mjs "target/$TRIPLE/release/bundle/macos/Fleetify.app" --expected-dr scripts/release/macos-designated-requirement.txt
      - name: Check the macOS signature (dry run)
        if: inputs.environment == 'dry-run'
        run: node scripts/release/macos-signature.mjs "target/$TRIPLE/release/bundle/macos/Fleetify.app"
      # A dry run keeps codesign's own answers to macos-signature.mjs's four
      # commands, whether its checks pass or not: the test fixtures in
      # scripts/release/fixtures/codesign/captured are such output.
      # It keeps the app's extended attributes too: Tauri clears them
      # (xattr -crs) between making the app and signing it.
      - name: Keep codesign's output (dry run)
        if: always() && inputs.environment == 'dry-run'
        run: |
          app="target/$TRIPLE/release/bundle/macos/Fleetify.app"
          out="$RUNNER_TEMP/codesign-output"
          mkdir -p "$out"
          sw_vers > "$out/sw_vers.txt"
          if [ ! -d "$app" ]; then
            echo "no $app: the build didn't make it" > "$out/status.txt"
            exit 0
          fi
          xattr -lr "$app" > "$out/xattr.txt" 2>&1 || true
          capture() {
            local name=$1 status=0
            shift
            codesign "$@" "$app" > "$out/$name.stdout.txt" 2> "$out/$name.stderr.txt" || status=$?
            echo "$name: codesign $* <app>: exit $status" >> "$out/status.txt"
          }
          capture verify --verify --deep --strict --verbose=2
          capture requirements -d -r-
          capture display -d -vvv
          capture entitlements -d --entitlements - --xml
      - name: Upload codesign's output (dry run)
        if: always() && inputs.environment == 'dry-run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codesign-output-${{ matrix.triple }}
          path: ${{ runner.temp }}/codesign-output
          if-no-files-found: warn
          retention-days: 7
      # Into a folder of its own first: collect-bundles.mjs fills only an
      # empty one, so the artifact holds only this build's files.
      - name: Collect the bundles
        run: node scripts/release/collect-bundles.mjs --target "$TRIPLE" --version "$VERSION" --out "$RUNNER_TEMP/bundles"
      # The updater artifact's signature verifies against the key the
      # release's updater trusts, or in a dry run the run's own, and names
      # the release's version: tauri bundle signs it for the version in
      # tauri.conf.json, which check-versions.mjs keeps equal to it.
      - name: Check the updater signature (release)
        if: inputs.environment == 'release'
        run: |
          updaters=$(node scripts/release/release-assets.mjs updaters "$TRIPLE" "$VERSION")
          files=()
          while IFS= read -r name; do files+=("$RUNNER_TEMP/bundles/$name"); done <<< "$updaters"
          node scripts/release/minisign.mjs verify --pubkey-config src-tauri/tauri.conf.json --expect-key-id 44C694713A20D751 --version "$VERSION" "${files[@]}"
      - name: Check the updater signature (dry run)
        if: inputs.environment == 'dry-run'
        run: |
          updaters=$(node scripts/release/release-assets.mjs updaters "$TRIPLE" "$VERSION")
          files=()
          while IFS= read -r name; do files+=("$RUNNER_TEMP/bundles/$name"); done <<< "$updaters"
          node scripts/release/minisign.mjs verify --pubkey-file "$RUNNER_TEMP/dry-run/updater.key.pub" --version "$VERSION" "${files[@]}"
      # assemble.mjs checks each dry-run build's signatures against its own key.
      - name: Add the run's updater public key (dry run)
        if: inputs.environment == 'dry-run'
        run: cp "$RUNNER_TEMP/dry-run/updater.key.pub" "$RUNNER_TEMP/bundles/updater-pubkey.txt"
      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.triple }}
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error
          retention-days: 7
      - name: Delete the run's updater key (dry run)
        if: always() && inputs.environment == 'dry-run'
        run: rm -f "$RUNNER_TEMP/dry-run/updater.key" "$RUNNER_TEMP/dry-run/updater.key.pub" "$RUNNER_TEMP/dry-run-config/dry-run.json"
