name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Builds per-OS installers via Tauri bundler. Triggers on `v*` tags so a
# typical release flow is: bump versions in Cargo.toml + tauri.conf.json
# → `git tag v0.2.0` → `git push --tags` → release artifacts appear on
# the GitHub release page in ~12 min.

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "src-tauri/target/release/bundle/deb/*.deb"
          - os: macos-latest
            artifact: "src-tauri/target/release/bundle/dmg/*.dmg"
          - os: windows-latest
            artifact: "src-tauri/target/release/bundle/msi/*.msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-bundle
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: |
          npm install
          npm run build || echo "(no frontend build script — proceeding with src-tauri only)"
      - name: Bundle Tauri installers
        # The Tauri CLI is added as a dev dep; cargo install isn't needed.
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetify-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

  # ── Attach installers to the GitHub Release for vX.Y.Z tag pushes ──
  publish:
    name: publish to GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
