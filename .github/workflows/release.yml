# Publishes Fleetify's releases, from release-please. It runs on every push to
# main, one run at a time: a run waits for the one before it to end, and none
# is cut short, so release-please never runs while a draft is pending. A newer
# push can take the place of a run still waiting; that run's work isn't lost,
# as release-please finds every release pull request that has merged.
#
# - release-please runs twice, with the Release Bot's token. First it makes
#   the release of a release pull request that has merged, if there is one: a
#   draft, whose tag doesn't exist yet. Only when it made none does the second
#   run open or update the release pull request, and not while a draft is
#   pending either: release-please finds the last release by its tag, so
#   until a draft is published, it would offer a release of every commit it
#   can reach. Events made with the App's token start workflows, unlike those
#   of the job's own token, so the release pull request gets its checks.
# - build runs build.yml on the draft's commit with the release keys, in the
#   release environment, whose deployments wait for the owner's approval.
# - assemble puts the release together with assemble.mjs, which checks every
#   updater signature against the key that src-tauri/tauri.conf.json ships.
#   It attests the files' build provenance, uploads them to the draft and
#   checks that the draft holds exactly the release's assets.
# - smoke runs smoke.yml on those files, against the pinned macOS designated
#   requirement.
# - publish, once assemble and smoke have passed, publishes the draft as the
#   latest release. That creates its tag, as the Release Bot: the tag rulesets
#   let only it and the organisation's admins create a v* tag, and no one move
#   or delete one. The job then checks the release, its tag and the
#   latest.json that installed copies ask GitHub for.
#
# The Release Bot's private key is in the release-bot environment, which only
# main may deploy to. release-please, assemble and publish name it, and each
# makes a token of its own, which only the steps that run gh get: the job's
# own token can't see a draft, let alone publish one. The attestation runs in
# a job of this workflow, not in a workflow it calls, so that each attestation
# names release.yml as its signer, which `gh attestation verify
# --signer-workflow` checks.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-24.04
    environment: release-bot
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # For this repository alone: contents for the release and the release
      # pull request's branch, pull requests for the pull request, and issues
      # for its labels.
      - name: Release Bot token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # The release of a release pull request that has merged, if any, and
      # nothing else: the action would otherwise go on to the release pull
      # request in the same step. It reads its config and manifest from main
      # through the API.
      - name: Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      # What the jobs after this one rely on. latest.json's download URLs look
      # for the files under v<version>. build.yml checks out the commit the
      # draft points at, as a branch could move on before publishing makes
      # the tag there.
      - name: Check the draft release-please created
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release-please tagged the release $TAG, not v$VERSION"
            exit 1
          fi
          # Forty characters, none of them other than 0-9 and a-f.
          if [ "${#SHA}" -ne 40 ] || [ -n "${SHA//[0-9a-f]/}" ]; then
            echo "::error::the draft points at '$SHA', not at a commit"
            exit 1
          fi
          echo "the draft $TAG points at $SHA"
      # A draft has no tag, so release-please can't see it as the last
      # release, and a release pull request made while one is pending would
      # offer a release of every commit it can reach. The next step runs only
      # once this one has found no draft.
      - name: Look for a pending draft
        id: drafts
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          drafts=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'map(select(.draft)) | length')
          if [ "$drafts" -gt 0 ]; then
            echo "::warning::a draft release is pending: publish it by re-running its release run, or delete it. The release pull request waits until then."
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      # The release pull request, opened or updated, after an ordinary push.
      - name: Release pull request
        if: steps.release.outputs.release_created != 'true' && steps.drafts.outputs.pending == 'false'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # The draft's tag doesn't exist yet, so the build checks out its commit.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      environment: release
      version: ${{ needs.release-please.outputs.version }}

  assemble:
    name: Assemble the release
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    environment: release-bot
    timeout-minutes: 30
    # id-token and attestations, for the build provenance attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The release scripts, the install scripts among them, and the updater
      # key every build ships, as the draft's commit has them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          sparse-checkout: |
            .nvmrc
            scripts/release
            src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The bundles and the notices only: assemble.mjs refuses any other
      # folder it finds in --in.
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: artifacts
      - name: Download the notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: artifacts/third-party-notices
      # Every signature must verify against the key every build ships, which
      # must be the release key. No build makes the install scripts, so they
      # come from the checkout.
      - name: Assemble
        run: >-
          node scripts/release/assemble.mjs --in artifacts --out release --version "$VERSION"
          --pubkey-config src-tauri/tauri.conf.json --expect-key-id 44C694713A20D751
          --extra scripts/release/install.sh --extra scripts/release/install.ps1
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      # Made once the release is assembled and attested, for the draft's
      # assets alone.
      - name: Release Bot token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      # Only to a draft: a published release's files are public, and stay as
      # they are. --clobber replaces what an earlier attempt uploaded.
      - name: Upload the release to the draft
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::$TAG is published already, so its files can't change"
            exit 1
          fi
          gh release upload "$TAG" release/* --clobber
      # Exactly the assets expectedAssets() names, each uploaded in full.
      - name: Check the draft's assets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          expected=$(node scripts/release/release-assets.mjs expected "$VERSION")
          assets=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | LC_ALL=C sort)
          if [ "$assets" != "$expected" ]; then
            echo "::error::the draft $TAG doesn't hold exactly the release's assets, each uploaded in full"
            echo "expected:"
            echo "$expected"
            echo "uploaded:"
            echo "$assets"
            exit 1
          fi
          echo "the draft $TAG holds exactly the release's assets"
      # For the smoke. The release's files are on GitHub, so the artifact is
      # kept only as long as the builds'.
      - name: Upload the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  # A release build's updater asks only the shipped endpoints, so there is no
  # update to rehearse.
  smoke:
    needs: [release-please, assemble]
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      rehearse: false
      expected-dr: scripts/release/macos-designated-requirement.txt

  publish:
    name: Publish the release
    needs: [release-please, assemble, smoke]
    runs-on: ubuntu-24.04
    environment: release-bot
    timeout-minutes: 10
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      SHA: ${{ needs.release-please.outputs.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Release Bot token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      # Publishing the draft makes its tag, at the draft's commit, as the
      # Release Bot.
      - name: Publish the draft as the latest release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh release edit "$TAG" --draft=false --latest
      - name: Check that the release is published, and the latest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          state=$(gh release view "$TAG" --json isDraft,tagName --jq '"draft \(.isDraft), tag \(.tagName)"')
          if [ "$state" != "draft false, tag $TAG" ]; then
            echo "::error::$TAG isn't published: $state"
            exit 1
          fi
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" != "$TAG" ]; then
            echo "::error::the latest release is $latest, not $TAG"
            exit 1
          fi
          echo "$TAG is published, and the latest release"
      # The tag publishing made must point at the commit the release was
      # built from.
      - name: Check the tag
        run: |
          tag=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG")
          if [ "$tag" != "$(printf '%s\trefs/tags/%s' "$SHA" "$TAG")" ]; then
            echo "::error::the tag $TAG isn't at $SHA, the commit the release was built from: ${tag:-there is no such tag}"
            exit 1
          fi
          echo "the tag $TAG is at $SHA"
      # The second of the updater's endpoints in src-tauri/tauri.conf.json,
      # which installed copies ask when fleetify.dev doesn't answer. GitHub's
      # address for the latest release can take a moment to follow it.
      - name: Check the latest.json GitHub serves
        run: |
          url=https://github.com/fleetifydev/fleetify/releases/latest/download/latest.json
          served=""
          for attempt in {1..12}; do
            if [ "$attempt" -gt 1 ]; then sleep 10; fi
            served=$(curl -fsSL "$url" | jq -r .version) || served=""
            if [ "$served" = "$VERSION" ]; then
              echo "$url names $VERSION"
              exit 0
            fi
          done
          echo "::error::$url names ${served:-no version}, not $VERSION"
          exit 1
