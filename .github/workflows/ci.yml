# Fleetify CI — the gate set documented in CLAUDE.md ("Testing"), wired so the
# checks stop being honor-system. Mirrors the exact local commands.
#
# Notes:
# - The default build ships on-device Whisper (PR #255), so the workspace
#   compiles whisper.cpp via whisper-rs-sys. That needs CMake + a C++ toolchain
#   and libclang (bindgen). windows-latest preinstalls all three (MSVC, CMake,
#   LLVM/Clang on PATH), so no extra setup step is required; if a future runner
#   image drops libclang, set LIBCLANG_PATH on the rust job. macos-15 ships
#   them too (Xcode's clang and libclang, Homebrew's CMake); on ubuntu-24.04
#   the rust-unix job installs them from apt, with Tauri's GTK and WebKitGTK
#   libraries.
# - The Rust job runs on windows-latest because that is the project's real
#   target (keyring `windows-native`, `winreg`, ConPTY) and matches the local
#   commands devs run. The rust-unix job compiles and lints the workspace on
#   Linux and macOS as well, so code behind `cfg(target_os = "linux")` or
#   `cfg(target_os = "macos")` can't break unseen until a release build.
# - The PR title check runs in pr-title.yml, so that editing a title reruns it
#   without rerunning this workflow.
# - `cargo audit` / `npm audit` are advisory for now (continue-on-error) so a
#   single transitive advisory (e.g. rsa RUSTSEC-2023-0071) doesn't wall every
#   PR. Flip them to blocking once the known advisories are triaged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    # The default build compiles whisper.cpp (cmake/C++) — heavy. Bound the job
    # so a hung advisory test or a pathological compile can't run for hours.
    timeout-minutes: 35
    # Cargo colours its output only on a terminal, which a job's log isn't.
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # The Rust release rust-toolchain.toml pins, with rustfmt and clippy:
      # given no toolchain name, rustup installs the one that file names, so
      # CI builds with the same compiler as a local run. Bash rather than the
      # Windows default, PowerShell, so that a failed install fails the step.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # Each runner image gets its own Rust cache: a cache saved on one image
      # carries that image's MSVC paths (whisper-rs-sys's CMake build dir) and
      # breaks the build on another image during an image rollout. The key is
      # the image type and version; without a version the step fails rather
      # than share one cache across images.
      - name: Runner image version (cache key)
        shell: pwsh
        run: |
          if (-not $env:ImageVersion) { throw 'The runner sets no ImageVersion, which the Rust cache key needs.' }
          "IMAGE_VERSION=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.IMAGE_VERSION }}
      # The 4 fleet-*-mcp sidecars are standalone workspace bins, NOT deps of
      # src-tauri — nothing compiles them implicitly. But Tauri's externalBin
      # build script resolves `binaries/fleet-*-mcp-<triple>` at build time, so
      # `cargo check` on fleetify-app fails ("resource path … doesn't exist")
      # unless they're staged first. Locally `dev:tauri:wt` runs this via
      # beforeDevCommand; CI must do it explicitly. node ships on windows-latest
      # and the script is dependency-free (node builtins + cargo only).
      # Drift guard, before the staging build so it fails in milliseconds
      # rather than after a cargo compile. SIDECARS in build-sidecars.mjs and
      # bundle.externalBin in tauri.conf.json must list the same binaries; a
      # comment used to ask contributors to remember, which is not a gate.
      - name: Sidecar drift guard
        run: node scripts/build-sidecars.mjs --check
      - name: Stage MCP sidecars (Tauri externalBin)
        run: node scripts/build-sidecars.mjs
      # Format first — instant, fails fast on style before the heavy compile.
      - name: Format
        run: cargo fmt --all -- --check
      # HARD GATE: clippy compiles the whole workspace AND lints it, so it is
      # both the "everything compiles" gate and the lint gate — running a
      # separate `cargo check` first just paid the (heavy, whisper.cpp) compile
      # twice. -D warnings makes any lint a failure; the workspace is clean.
      - name: Clippy (compile + lint)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Test stays ADVISORY (continue-on-error) and runs on the Windows runner.
      # Bounded so a test that hangs (binds a port / spawns a process and waits)
      # can't wedge the job — continue-on-error keeps a timeout non-blocking.
      # --no-fail-fast: a failing test target must not stop the rest from running.
      - name: Test (advisory)
        continue-on-error: true
        timeout-minutes: 12
        run: cargo test --workspace --no-fail-fast
      # Prebuilt cargo-audit binary — `cargo install --locked` compiles it from
      # source (several minutes) and pushed the job past its timeout. This pulls
      # a release binary in seconds. Bounded + continue-on-error so a slow or
      # failing advisory audit never wedges or blocks CI.
      - name: Install cargo-audit (advisory)
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit (advisory)
        continue-on-error: true
        timeout-minutes: 5
        run: cargo audit

  # Clippy on Linux and macOS: it compiles the workspace for each OS, tests
  # included (--all-targets), so code behind their cfgs is built before a
  # release build is. Fmt, which reads the same on every OS, and running the
  # tests stay with the rust job.
  rust-unix:
    # Named by platform, not by runner: the main ruleset requires these checks
    # by name, so moving to a newer runner image mustn't rename them.
    name: Rust clippy (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # A cold cache compiles the whole workspace, whisper.cpp included.
    timeout-minutes: 40
    strategy:
      # Each OS reports a check of its own, so one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    # Cargo colours its output only on a terminal, which a job's log isn't.
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # As in the rust job: the release that rust-toolchain.toml pins.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # The Linux packages from CONTRIBUTING.md, which a script test keeps in
      # step with this list: what Tauri builds against, plus CMake and libclang
      # for whisper.cpp and the ALSA and D-Bus headers. The job shows the
      # documented list is enough to compile the workspace on the runner image.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config cmake libclang-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev patchelf
      # As in the rust job: one Rust cache per runner image, since a cache
      # built on one image can carry paths (Xcode's, CMake's) that another
      # image lacks. Both images set ImageOS and ImageVersion.
      - name: Runner image version (cache key)
        shell: bash
        run: |
          if [ -z "${ImageVersion:-}" ]; then
            echo "::error::The runner sets no ImageVersion, which the Rust cache key needs."
            exit 1
          fi
          echo "IMAGE_VERSION=${ImageOS:-}-${ImageVersion}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.IMAGE_VERSION }}
      # As in the rust job: Tauri's build script needs the sidecars staged
      # under this OS's target triple.
      - name: Stage MCP sidecars (Tauri externalBin)
        run: node scripts/build-sidecars.mjs
      - name: Clippy (compile + lint)
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: Renderer (lint + test + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b tsconfig.build.json --noEmit
      # Advisory: vitest needs a Node-version-specific webstorage flag locally;
      # keep visible until the CI Node version is confirmed green.
      - name: Unit tests (advisory)
        continue-on-error: true
        run: npm test
      # The config tests parse YAML with python3 and PyYAML, and skip those
      # checks where PyYAML is missing. Fail here instead, so a runner image
      # without it can't quietly turn the hard gate below into skips.
      - name: Check PyYAML for the config tests
        run: python3 -c "import yaml"
      # The node:test suites of the repo's own scripts: the DCO check, the
      # GitHub config and the public docs' links and contacts (scripts/ci), and
      # the release secret scanner (scripts/release). A hard gate, because they
      # are deterministic and fast.
      - name: Script tests
        run: node --test "scripts/ci/*.test.mjs" "scripts/release/*.test.mjs"
      # actionlint checks every workflow: its syntax and expressions, the
      # inputs of the actions and reusable workflows it calls, and its shell
      # scripts, with the shellcheck the image includes. A workflow that runs
      # only after it merges, such as the release's, is checked here first.
      # The image is pinned by digest, so the reference can't move.
      - name: Lint the workflows (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
      - name: Audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev
