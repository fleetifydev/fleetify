name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two layers, one for each surface contributors actually touch.
# Phase 5 hardening lands per-OS smoke installer testing on a separate
# release workflow; ci.yml stays fast (≤ 5 min on cache hit) so PRs
# get green-or-red feedback inside one coffee.

env:
  CARGO_TERM_COLOR: always
  # Prevents the rustup hang on Windows Runners that started in Oct 2025.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── Backend + Tauri shell tests on every supported OS ───────────
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-OS cache key so a Windows build doesn't clobber Linux's.
          shared-key: ${{ matrix.os }}-test
      # Tauri needs system webview + GTK headers on Linux.
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace --no-fail-fast
      # Clippy as a non-blocking signal — surfaces real errors (where
      # the lint can't be auto-suggested away) but lets non-blocking
      # stylistic lints land in PRs so they can be cleaned in batches.
      - run: cargo clippy --workspace --all-targets

  # ── Build the Tauri binary on every OS (no bundle — bundlers run
  #    in the release workflow). Confirms the full link succeeds
  #    against the per-OS Tauri sysdeps. ──
  build:
    name: cargo build --release (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-build
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - run: cargo build --release --workspace --locked
