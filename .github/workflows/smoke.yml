# Smoke-tests a release's bundles: each is installed, or unpacked, and
# started the way a user starts it, from the filesystem root with a fresh
# home, by scripts/release/launch-smoke.mjs, whose header lists the checks.
# With rehearse, each also rehearses an update: the app must find, download
# and verify version 99.0.0 of its own bundle type from a local update
# server, which only a dry-run build asks. The server offers the rehearsal's
# signatures, which the dry run's builds made for 99.0.0, from the run's
# rehearsal artifact: the updater takes only a signature made for the
# version it is offered, so the release's own, made for its version, can't
# serve.
#
# Each job checks out only scripts/release, into tools/, so the bundles run
# without the source tree, as they do on a user's machine: from the commit
# the ref input names, or the run's own. The release comes from the run's
# release artifact.
#
# Each job then installs once more with the release's install script, as a
# user runs it, from the release served on 127.0.0.1:18081 the way GitHub
# serves it (launch-smoke.mjs serve-release). On macOS and Windows that also
# checks that a scripted download carries no quarantine flag or
# Mark-of-the-Web, so Gatekeeper and SmartScreen don't stop it.
#
# The variables say what the build compiled in. CSP_ORIGIN, the PostHog host
# the renderer got, must be allowed by the UI's content security policy;
# empty, as on a fork's pull request, it isn't checked. With a PostHog
# project key, the app's log must show the PostHog sink starting.
name: Smoke-test release bundles

on:
  workflow_call:
    inputs:
      version:
        description: The release's version, MAJOR.MINOR.PATCH.
        required: true
        type: string
      rehearse:
        description: Rehearse an update with each bundle (dry-run builds only).
        required: true
        type: boolean
      expected-dr:
        description: The pinned macOS designated requirement, as a path in the repository; empty to check its shape only.
        required: false
        type: string
        default: ""
      ref:
        description: The commit whose release scripts and pinned designated requirement the smoke uses; empty for the commit the run is on.
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  REHEARSE: ${{ inputs.rehearse }}
  EXPECTED_DR: ${{ inputs.expected-dr }}
  CSP_ORIGIN: ${{ vars.VITE_POSTHOG_HOST }}
  EXPECT_POSTHOG_SINK: ${{ vars.POSTHOG_API_KEY != '' }}

jobs:
  linux:
    name: Linux (AppImage, deb, rpm)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the release scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: tools
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # .nvmrc's version, which a script test keeps this one equal to.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # The signatures the rehearsal's update server offers.
      - name: Download the rehearsal's signatures
        if: inputs.rehearse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: rehearsal
      # A virtual display and a session bus for each launch, and what a
      # desktop provides: an AppImage leaves the graphics stack and a few
      # base libraries to the system, and this image is a server's. Mesa's
      # EGL and GL render in software under Xvfb.
      - name: Packages the smoke needs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus \
            libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri libgbm1 libdrm2 libx11-6 libx11-xcb1 libxcb1 \
            libasound2t64 libcom-err2 libexpat1 libfontconfig1 libfreetype6 libfribidi0 libharfbuzz0b \
            libgmp10 libgpg-error0 zlib1g libstdc++6 libgcc-s1
      # A library the AppImage leaves to the system and the system lacks
      # would stop the app at start with exit 127; this lists every one.
      - name: Check the libraries the AppImage leaves to the system
        run: |
          appimages=(release/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "::error::expected one AppImage in release/, found: ${appimages[*]}"
            exit 1
          fi
          chmod +x "${appimages[0]}"
          node tools/scripts/release/appimage-host-libs.mjs --appimage "${appimages[0]}"
      # Extracted rather than mounted, which takes no FUSE.
      - name: AppImage
        run: |
          appimages=(release/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "::error::expected one AppImage in release/, found: ${appimages[*]}"
            exit 1
          fi
          chmod +x "${appimages[0]}"
          args=(run --app "${appimages[0]}" --app-arg --appimage-extract-and-run --home "$RUNNER_TEMP/home-appimage" --csp-origin "$CSP_ORIGIN")
          if [ "$EXPECT_POSTHOG_SINK" = true ]; then args+=(--expect-posthog-sink); fi
          if [ "$REHEARSE" = true ]; then args+=(--rehearse release --rehearsal-signatures rehearsal --bundle-type appimage); fi
          xvfb-run -a dbus-run-session -- node tools/scripts/release/launch-smoke.mjs "${args[@]}"
      - name: Debian package
        run: |
          debs=(release/*.deb)
          if [ "${#debs[@]}" -ne 1 ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::expected one .deb in release/, found: ${debs[*]}"
            exit 1
          fi
          sudo apt-get install -y "./${debs[0]}"
          # The app, not one of the MCP sidecars installed beside it.
          exe=$(dpkg -L fleetify | grep '^/usr/bin/' | grep -v '/fleet-[a-z]*-mcp$' || true)
          legal=$(dpkg -L fleetify | grep '/legal$' || true)
          for found in "$exe" "$legal"; do
            if [ -z "$found" ] || [ "$(printf '%s\n' "$found" | wc -l)" -ne 1 ]; then
              echo "::error::expected one app executable in /usr/bin and one legal folder in the package, found: ${exe:-none}; ${legal:-none}"
              exit 1
            fi
          done
          args=(run --app "$exe" --home "$RUNNER_TEMP/home-deb" --legal-dir "$legal" --csp-origin "$CSP_ORIGIN")
          if [ "$EXPECT_POSTHOG_SINK" = true ]; then args+=(--expect-posthog-sink); fi
          if [ "$REHEARSE" = true ]; then args+=(--rehearse release --rehearsal-signatures rehearsal --bundle-type deb); fi
          xvfb-run -a dbus-run-session -- node tools/scripts/release/launch-smoke.mjs "${args[@]}"
      # The .rpm's dependencies must resolve on a current Fedora. openSUSE
      # names the same libraries in its own packages; it is checked too, but
      # only for information.
      - name: rpm resolution (Fedora)
        run: |
          rpms=(release/*.rpm)
          if [ "${#rpms[@]}" -ne 1 ] || [ ! -f "${rpms[0]}" ]; then
            echo "::error::expected one .rpm in release/, found: ${rpms[*]}"
            exit 1
          fi
          docker run --rm -v "$PWD/release:/release:ro" fedora:45 dnf install -y --nogpgcheck "/${rpms[0]}"
      - name: openSUSE rpm resolution (informational)
        continue-on-error: true
        run: |
          rpms=(release/*.rpm)
          docker run --rm -v "$PWD/release:/release:ro" opensuse/tumbleweed zypper --non-interactive install --allow-unsigned-rpm "/${rpms[0]}"
      # The install script as a user runs it: piped into sh from the release,
      # with a home of the step's own. It installs the AppImage, with a menu
      # entry and the icon it takes out of the AppImage.
      - name: Install via script
        env:
          FLEETIFY_INSTALL_BASE: http://127.0.0.1:18081
        run: |
          home="$RUNNER_TEMP/home-install"
          mkdir -p "$home"
          node tools/scripts/release/launch-smoke.mjs serve-release --dir release --version "$VERSION" --port 18081 > "$home/release-server.log" 2>&1 &
          server=$!
          # Stop the server, and only it, however the step ends; then show what it served.
          trap 'kill "$server" 2> /dev/null || true; wait "$server" 2> /dev/null || true; cat "$home/release-server.log" || true' EXIT
          # curl retries until the server listens.
          curl -fsSL --retry 10 --retry-connrefused --retry-delay 1 "$FLEETIFY_INSTALL_BASE/latest/download/install.sh" |
            HOME="$home" XDG_DATA_HOME="$home/.local/share" sh -s -- --dir "$RUNNER_TEMP/bin"
          appimages=(release/*.AppImage)
          installed="$RUNNER_TEMP/bin/fleetify"
          if [ ! -x "$installed" ] || ! cmp -s "$installed" "${appimages[0]}"; then
            echo "::error::install.sh didn't install the release's AppImage as $installed"
            exit 1
          fi
          entry="$home/.local/share/applications/fleetify.desktop"
          if ! grep -qFx "Exec=$installed %U" "$entry"; then
            echo "::error::$entry doesn't start $installed"
            exit 1
          fi
          icon="$home/.local/share/icons/hicolor/256x256/apps/fleetify.png"
          if [ "$(od -An -tx1 -N8 "$icon" | tr -d ' \n')" != 89504e470d0a1a0a ]; then
            echo "::error::install.sh didn't install the AppImage's icon, a PNG, as $icon"
            exit 1
          fi
      - name: Upload the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-linux
          path: ${{ runner.temp }}/home-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows (NSIS)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the release scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: tools
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # .nvmrc's version, which a script test keeps this one equal to.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # The signatures the rehearsal's update server offers.
      - name: Download the rehearsal's signatures
        if: inputs.rehearse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: rehearsal
      # A per-user install, as a user's silent one, into %LOCALAPPDATA%\Fleetify.
      - name: Install (silent, per user)
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path release -Filter '*-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "expected one installer in release, found: $($installer.Name -join ', ')" }
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the installer exited $($process.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Fleetify'
          # The app, not the uninstaller or one of the MCP sidecars beside it.
          $exe = @(Get-ChildItem -Path $dir -Filter '*.exe' -File | Where-Object { $_.Name -ne 'uninstall.exe' -and $_.Name -notlike 'fleet-*' })
          if ($exe.Count -ne 1) { throw "expected one app executable in $dir, found: $($exe.Name -join ', ')" }
          "APP_EXE=$($exe[0].FullName)" >> $env:GITHUB_ENV
          "LEGAL_DIR=$(Join-Path $dir 'legal')" >> $env:GITHUB_ENV
      # From the system drive's root: the smoke starts every app from a
      # filesystem root, away from the folder it is installed in.
      - name: NSIS install
        run: |
          args=(run --app "$APP_EXE" --cwd "C:\\" --home "$RUNNER_TEMP/home-nsis" --legal-dir "$LEGAL_DIR" --csp-origin "$CSP_ORIGIN")
          if [ "$EXPECT_POSTHOG_SINK" = true ]; then args+=(--expect-posthog-sink); fi
          if [ "$REHEARSE" = true ]; then args+=(--rehearse release --rehearsal-signatures rehearsal --bundle-type nsis); fi
          node tools/scripts/release/launch-smoke.mjs "${args[@]}"
      # install.ps1 as a user runs it, in Windows PowerShell 5.1: fetched from
      # the release and run as a script block, with -Silent. It installs over
      # the app above, whose executable goes first, so the installer has to
      # put it back. Its download folder holds what an earlier run could have
      # left: an older installer, which install.ps1 removes, and a file that
      # isn't its own, which it keeps.
      - name: Install via script
        shell: powershell
        env:
          FLEETIFY_INSTALL_BASE: http://127.0.0.1:18081
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'home-install'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $downloads = Join-Path $env:TEMP 'fleetify-install'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          Set-Content -LiteralPath (Join-Path $downloads 'Fleetify_0.0.1_x64-setup.exe') -Value 'an older installer'
          Set-Content -LiteralPath (Join-Path $downloads 'notes.txt') -Value 'not a file of install.ps1'
          $node = (Get-Command node).Source
          $server = Start-Process -FilePath $node -ArgumentList 'tools/scripts/release/launch-smoke.mjs', 'serve-release', '--dir', 'release', '--version', $env:VERSION, '--port', '18081' -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $logs 'release-server.log') -RedirectStandardError (Join-Path $logs 'release-server.err')
          try {
            # Fetched once the server listens.
            $installScript = $null
            foreach ($attempt in 1..30) {
              try {
                $installScript = Invoke-RestMethod -Uri "$env:FLEETIFY_INSTALL_BASE/latest/download/install.ps1"
                break
              } catch {
                # An answer with an error status is final; no answer means the
                # server is still starting.
                if ($null -ne $_.Exception.Response) {
                  throw "the release server answered $([int]$_.Exception.Response.StatusCode) for install.ps1"
                }
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $installScript) { throw 'the release server never answered' }
            Remove-Item -LiteralPath $env:APP_EXE
            & ([scriptblock]::Create($installScript)) -Silent
            if (-not (Test-Path -LiteralPath $env:APP_EXE)) { throw "install.ps1 -Silent didn't install $env:APP_EXE" }
            if (Test-Path -LiteralPath (Join-Path $downloads 'Fleetify_0.0.1_x64-setup.exe')) { throw "install.ps1 left an older installer in $downloads" }
            if (-not (Test-Path -LiteralPath (Join-Path $downloads 'notes.txt'))) { throw "install.ps1 removed a file from $downloads that isn't its own" }
            $downloaded = @(Get-ChildItem -Path $downloads -Filter '*-setup.exe' -File)
            $released = @(Get-ChildItem -Path release -Filter '*-setup.exe' -File)
            if ($downloaded.Count -ne 1 -or (Get-FileHash -LiteralPath $downloaded[0].FullName).Hash -ne (Get-FileHash -LiteralPath $released[0].FullName).Hash) {
              throw "install.ps1 didn't leave the release's installer in $env:TEMP\fleetify-install"
            }
            # A file PowerShell downloads carries no Mark-of-the-Web, so SmartScreen
            # doesn't stop the installer; if that changes, the install docs must say so.
            if (Get-Item "$env:TEMP\fleetify-install\*-setup.exe" -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
              throw 'the installer install.ps1 downloaded carries a Mark-of-the-Web (Zone.Identifier)'
            }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            Get-Content -Path (Join-Path $logs 'release-server.log') -ErrorAction SilentlyContinue
          }
      # The app logs into %LOCALAPPDATA%\Fleetify\logs, outside the smoke's home.
      - name: Collect the app's log
        if: failure()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'Fleetify\logs'
          if (Test-Path $logs) { Copy-Item -Recurse -Path $logs -Destination (Join-Path $env:RUNNER_TEMP 'home-nsis-logs') }
      - name: Upload the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-windows
          path: ${{ runner.temp }}/home-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out the release scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: tools
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # .nvmrc's version, which a script test keeps this one equal to.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # The signatures the rehearsal's update server offers.
      - name: Download the rehearsal's signatures
        if: inputs.rehearse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: rehearsal
      - name: Mount the disk image
        run: |
          dmgs=(release/*_"$ARCH".dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::expected one $ARCH disk image in release/, found: ${dmgs[*]}"
            exit 1
          fi
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "${dmgs[0]}"
      # The app as the disk image ships it. A pinned designated requirement is
      # read from tools/; without one, its shape is checked.
      - name: Check the signature
        run: |
          args=("$RUNNER_TEMP/dmg/Fleetify.app")
          if [ -n "$EXPECTED_DR" ]; then args+=(--expected-dr "tools/$EXPECTED_DR"); fi
          node tools/scripts/release/macos-signature.mjs "${args[@]}"
      # Copied out as a user installs it, into a folder of the job's own:
      # /tmp is a symlink, which tauri-utils rejects as the app's location.
      - name: Install into an Applications folder
        run: |
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$RUNNER_TEMP/dmg/Fleetify.app" "$RUNNER_TEMP/Applications/Fleetify.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: macOS app
        run: |
          app="$RUNNER_TEMP/Applications/Fleetify.app"
          exe=$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")
          args=(run --app "$app/Contents/MacOS/$exe" --home "$RUNNER_TEMP/home-app" --legal-dir "$app/Contents/Resources/legal" --csp-origin "$CSP_ORIGIN")
          if [ "$EXPECT_POSTHOG_SINK" = true ]; then args+=(--expect-posthog-sink); fi
          if [ "$REHEARSE" = true ]; then args+=(--rehearse release --rehearsal-signatures rehearsal --bundle-type app); fi
          node tools/scripts/release/launch-smoke.mjs "${args[@]}"
      # The install script as a user runs it: piped into sh from the release.
      # A file curl downloads carries no quarantine flag, so Gatekeeper
      # doesn't stop the app's first start; if that changes, the install docs
      # must say so.
      - name: Install via script
        env:
          FLEETIFY_INSTALL_BASE: http://127.0.0.1:18081
        run: |
          home="$RUNNER_TEMP/home-install"
          mkdir -p "$home"
          node tools/scripts/release/launch-smoke.mjs serve-release --dir release --version "$VERSION" --port 18081 > "$home/release-server.log" 2>&1 &
          server=$!
          # Stop the server, and only it, however the step ends; then show what it served.
          trap 'kill "$server" 2> /dev/null || true; wait "$server" 2> /dev/null || true; cat "$home/release-server.log" || true' EXIT
          # curl retries until the server listens.
          curl -fsSL --retry 10 --retry-connrefused --retry-delay 1 "$FLEETIFY_INSTALL_BASE/latest/download/install.sh" | sh -s -- --dir "$RUNNER_TEMP/Applications2"
          app="$RUNNER_TEMP/Applications2/Fleetify.app"
          args=("$app")
          if [ -n "$EXPECTED_DR" ]; then args+=(--expected-dr "tools/$EXPECTED_DR"); fi
          node tools/scripts/release/macos-signature.mjs "${args[@]}"
          attrs=$(xattr -lr "$app")
          if xattr -p com.apple.quarantine "$app" > /dev/null 2>&1 || [[ "$attrs" == *com.apple.quarantine* ]]; then
            echo "::error::$app, installed by install.sh, carries a quarantine flag"
            exit 1
          fi
          plist="$app/Contents/Info.plist"
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          exe=$(plutil -extract CFBundleExecutable raw "$plist")
          arch=$(lipo -archs "$app/Contents/MacOS/$exe")
          if [ "$version" != "$VERSION" ] || [ "$arch" != "$(uname -m)" ]; then
            echo "::error::install.sh installed Fleetify $version for $arch, not $VERSION for $(uname -m)"
            exit 1
          fi
      - name: Upload the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/home-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
