# Dependency licences, security advisories, duplicate crates and crate sources,
# checked by cargo-deny against deny.toml. The local equivalent is
# `cargo deny check licenses advisories bans sources`.
#
# Not a required check: a red run doesn't block a merge. Treat it as red all
# the same: fix the dependency, or add a triaged ignore to deny.toml.
#
# It runs on pull requests that change a Cargo manifest, Cargo.lock, deny.toml
# or this workflow, weekly (new advisories arrive without any change here), and
# on demand.
name: cargo-deny

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v2.1.3 runs cargo-deny 0.22.0, the version deny.toml is written for.
      # Pinned to the release's commit, so the reference can't move.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          # Check the committed Cargo.lock as it is. This replaces the action's
          # default arguments (--all-features); deny.toml's [graph] turns on
          # every feature instead, so a local run checks the same graph.
          arguments: --locked
          command: check
          command-arguments: licenses advisories bans sources
