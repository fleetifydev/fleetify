name: Feature request
description: Suggest a new capability or an improvement to Fleetify.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For an open-ended idea or a question, [start a discussion](https://github.com/fleetifydev/fleetify/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? Describe the problem before any solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What should Fleetify do, and how would you use it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you've considered, if any.
