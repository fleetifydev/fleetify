# Dependabot version updates, checked weekly.
#
# npm and GitHub Actions group minor and patch updates, and a major update gets
# a pull request of its own. npm has two groups, runtime and dev dependencies,
# so that each grouped pull request takes the right commit prefix (see below).
# Cargo groups patch updates only. A minor update to a 0.x crate can break the
# build, so Cargo minor updates come one per pull request, like major ones.
#
# Tauri upgrades stay manual. The workspace patches tauri-runtime-wry from
# vendor/ (see vendor/tauri-runtime-wry/FLEETIFY_PATCH.md), and Cargo silently
# drops that patch once tauri asks for another version of the runtime, so a
# Tauri upgrade means re-vendoring and reapplying the patches by hand. Cargo
# therefore ignores tauri and every tauri-* crate (the plugins pull a newer
# tauri in with them), plus wry and tao, which the vendored runtime depends on.
# On the npm side, @tauri-apps/* gets patch updates only: `tauri build` fails
# when @tauri-apps/api, or an @tauri-apps/plugin-* package, is on another
# major.minor than its Rust crate, and @tauri-apps/cli stays on the same line
# as a precaution. Dependabot's security updates bypass these ignore rules, so
# a security pull request for tauri or @tauri-apps is an alert: apply the fix
# through the manual vendored-runtime upgrade, "How to refresh on a Tauri bump"
# in vendor/tauri-runtime-wry/FLEETIFY_PATCH.md.
#
# Commit messages, and so pull request titles, use conventional types that the
# PR title check in pr-title.yml accepts: `deps:` for Cargo crates and npm runtime
# dependencies, `chore:` for npm dev dependencies, `ci:` for GitHub Actions.
# Dependabot titles a pull request `deps:` as soon as one runtime dependency is
# in it, hence npm's separate groups. `chore:` and `ci:` bumps stay out of the
# changelog and trigger no release. Dependabot's commits carry no sign-off; the
# DCO check exempts bots.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
      - dependency-name: "wry"
      - dependency-name: "tao"
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: chore
    ignore:
      # api and plugin-* must match their Rust crate's major.minor, or `tauri build`
      # fails; cli follows them as a precaution.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-production:
        dependency-type: "production"
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: "development"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
