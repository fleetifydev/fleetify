[agents.claude-code]
supports_tool_use = true
supports_vision = true
max_context = 200000
mcp_support = true
acp = false
default_model = "claude-sonnet-4-6"
tiers = ["claude-haiku-4-5", "claude-sonnet-4-6", "claude-opus-4-7"]

[agents.openai]
supports_tool_use = true
supports_vision = true
max_context = 128000
mcp_support = false
acp = false
default_model = "gpt-4o"
tiers = ["gpt-4o-mini", "gpt-4o"]

[agents.gemini-cli]
supports_tool_use = true
supports_vision = true
max_context = 1000000
mcp_support = false
acp = true
default_model = "gemini-3.1-pro-preview"
tiers = ["gemini-3.1-flash-lite-preview", "gemini-3.1-pro-preview"]

[agents.codex-cli]
supports_tool_use = true
supports_vision = false
max_context = 200000
mcp_support = true
acp = false
default_model = "gpt-5-codex"
tiers = ["gpt-5-codex"]

# Kimi Code CLI (Moonshot). ACP-based like Gemini — when the spawn impl
# lands in bridges/kimi.rs the routing layer is already ready.
[agents.kimi-code]
supports_tool_use = true
supports_vision = true
max_context = 200000
mcp_support = true
acp = true
default_model = "kimi-k2-instruct"
tiers = ["kimi-k1.5-preview", "kimi-k2-instruct", "kimi-k2-thinking"]
